name: Build and Deploy to Staging

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login ke GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Buat .env untuk build
        run: cp .env.example .env.docker

      - name: Extract metadata untuk image tag
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build dan push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          # Must match APP_NAME in the runtime env file, otherwise the client
          # bundle appends a second app name to every page title.
          build-args: |
            APP_NAME=POS Biasa
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ke VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          debug: true
          script: |
            echo "Connected!"
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
              -u ${{ github.actor }} \
              --password-stdin

            docker pull ghcr.io/${{ github.repository }}:latest

            docker stop pos || true
            docker rm pos || true

            docker run -d \
              --name pos \
              --network traefik \
              --env-file ${{ secrets.ROOT_PATH }}/.env \
              -v ${{ secrets.ROOT_PATH }}/storage:/var/www/html/storage \
              -v ${{ secrets.ROOT_PATH }}/caddy/Caddyfile:/etc/caddy/Caddyfile \
              --label traefik.enable=true \
              --label traefik.docker.network=traefik \
              --label "traefik.http.routers.pos.entrypoints=web,websecure" \
              --label "traefik.http.routers.pos.rule=Host(\`${{ secrets.APP_HOST }}\`) || Host(\`www.${{ secrets.APP_HOST }}\`)" \
              --label traefik.http.routers.pos.tls=true \
              --label traefik.http.routers.pos.tls.certresolver=letsencrypt \
              --label traefik.http.services.pos.loadbalancer.server.port=8080 \
              --label "traefik.http.middlewares.posHeaders.headers.customrequestheaders.X-Forwarded-Proto=https" \
              --label "traefik.http.routers.pos.middlewares=posHeaders" \
              --restart unless-stopped \
              ghcr.io/${{ github.repository }}:latest

            docker image prune -f