; Runs the processes the app needs in one container: the FrankenPHP web
; server, the Inertia SSR renderer, the queue worker and the task scheduler.
; Logs are forwarded to the container's stdout/stderr so `docker logs` keeps
; working.

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:frankenphp]
command=frankenphp run --config /etc/caddy/Caddyfile
directory=/var/www/html
autostart=true
autorestart=true
startretries=3
stopwaitsecs=30
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; The SSR bundle is a plain Node server listening on 127.0.0.1:13714 (see
; config/inertia.php). Running node directly rather than through
; `php artisan inertia:start-ssr` keeps it a single supervised process, so
; restarts and shutdown signals are not swallowed by a PHP wrapper.
;
; If this process is down the site still serves — Inertia catches the failed
; connection and renders client-side instead.
[program:inertia-ssr]
command=node /var/www/html/bootstrap/ssr/app.js
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startretries=5
stopwaitsecs=10
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Processes queued jobs (QUEUE_CONNECTION=database). `--max-time` makes the
; worker exit cleanly every hour so supervisor restarts it with fresh memory,
; and stopwaitsecs gives a running job time to finish on shutdown. Runs as
; www-data so files it writes under storage/ are not owned by root.
[program:queue-worker]
command=php /var/www/html/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startretries=5
stopwaitsecs=60
priority=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Runs the tasks in routes/console.php.
; `schedule:work` stays in the foreground and triggers `schedule:run` every
; minute, so no cron daemon is needed in the container. The tasks use
; onOneServer()/withoutOverlapping(), which lock through the cache store.
[program:scheduler]
command=php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
startretries=5
stopwaitsecs=10
priority=40
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Anything mounted into /etc/supervisor/conf.d (docker-compose does this for
; local development) is picked up as well.
[include]
files = /etc/supervisor/conf.d/*.conf
